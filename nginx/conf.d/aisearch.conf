# AI Search OS vhost 模板
# 部署到 VPS 后复制到 /srv/infra/nginx/conf.d/aisearch.conf
# （域名已写死为 aisearch.acuventech.com，如有变化请同步修改）

server {
    listen 80;
    server_name aisearch.acuventech.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name aisearch.acuventech.com;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    # 用变量驱动 proxy_pass，强制走 nginx.conf 里的 resolver（Docker 127.0.0.11），
    # 每次请求重新解析容器 IP；避免容器重建后 nginx 缓存旧 IP 返回 502。
    set $aisearch_backend "aisearch_backend:8000";

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        proxy_pass http://$aisearch_backend/health;
        proxy_set_header Host $host;
    }

    # 单容器架构：后端 FastAPI 同时托管 /chat API 与前端静态文件，
    # 全部请求直接转发给 aisearch_backend，无需拆分 location。
    location / {
        proxy_pass http://$aisearch_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
}
