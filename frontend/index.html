<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM & ERP AI 智能助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #1f2a44;
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  #lang-btn {
    background: #344266;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 14px;
  }
  #lang-btn:hover { background: #455584; }

  #shortcuts {
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    padding: 10px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-height: 140px;
    overflow-y: auto;
  }
  .shortcut-btn {
    background: #eef1f8;
    color: #1f2a44;
    border: 1px solid #d6dcec;
    border-radius: 16px;
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .shortcut-btn:hover { background: #dde4f5; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.6;
    font-size: 14px;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #1f6feb;
    color: #fff;
    border-bottom-right-radius: 2px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #fff;
    color: #1a1a1a;
    border: 1px solid #e0e0e0;
    border-bottom-left-radius: 2px;
  }
  .msg.assistant table {
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 13px;
  }
  .msg.assistant th, .msg.assistant td {
    border: 1px solid #ccc;
    padding: 4px 8px;
  }
  .msg.assistant th { background: #f5f5f5; }
  .msg.assistant code {
    background: #f0f0f0;
    padding: 1px 4px;
    border-radius: 3px;
  }
  .msg.thinking {
    align-self: flex-start;
    background: #fff;
    border: 1px solid #e0e0e0;
    color: #888;
    font-style: italic;
  }
  .dots span {
    display: inline-block;
    animation: blink 1.4s infinite both;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  #input-bar {
    background: #fff;
    border-top: 1px solid #e0e0e0;
    padding: 12px 20px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #input {
    flex: 1;
    resize: none;
    border: 1px solid #d0d0d0;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    max-height: 120px;
    outline: none;
  }
  #input:focus { border-color: #1f6feb; }
  #voice-btn, #send-btn {
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    padding: 10px 16px;
  }
  #voice-btn {
    background: #eef1f8;
    color: #1f2a44;
    font-size: 18px;
    padding: 10px 14px;
  }
  #voice-btn.recording {
    background: #e74c3c;
    color: #fff;
  }
  #voice-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  #send-btn {
    background: #1f6feb;
    color: #fff;
    font-weight: 600;
    min-width: 60px;
  }
  #send-btn:hover:not(:disabled) { background: #1a5fd0; }
  #send-btn:disabled { background: #8baee0; cursor: not-allowed; }

  /* ── Excel 导出按钮 ── */
  .export-btn {
    display: inline-block;
    margin-top: 10px;
    background: #f0f4ff;
    color: #1f2a44;
    border: 1px solid #c5d0ea;
    border-radius: 6px;
    padding: 5px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .export-btn:hover { background: #dde4f5; }

  /* ── Toast 提示 ── */
  #toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.72);
    color: #fff;
    padding: 8px 22px;
    border-radius: 20px;
    font-size: 13px;
    display: none;
    z-index: 500;
    pointer-events: none;
  }

  /* ── 登录弹窗 ── */
  #login-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.52);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  #login-overlay.show { display: flex; }
  #login-box {
    background: #fff;
    border-radius: 14px;
    padding: 36px 32px 28px;
    width: 360px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
  }
  #login-box h2 {
    font-size: 20px;
    color: #1f2a44;
    margin-bottom: 24px;
    text-align: center;
  }
  .login-field { margin-bottom: 16px; }
  .login-field label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 6px;
  }
  .login-field input {
    width: 100%;
    border: 1px solid #d0d0d0;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .login-field input:focus { border-color: #1f6feb; }
  #login-error {
    color: #e74c3c;
    font-size: 13px;
    margin-bottom: 12px;
    display: none;
    text-align: center;
  }
  /* reCAPTCHA v3 badge 可隐藏（已在登录框内用文字说明替代） */
  .grecaptcha-badge { visibility: hidden; }
  #login-submit {
    width: 100%;
    background: #1f6feb;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #login-submit:hover { background: #1a5fd0; }
  #login-submit:disabled { background: #8baee0; cursor: not-allowed; }
</style>
</head>
<body>

<!-- ── 登录弹窗 ── -->
<div id="login-overlay">
  <div id="login-box">
    <h2>请登录</h2>
    <div class="login-field">
      <label>邮箱</label>
      <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="login-field">
      <label>密码</label>
      <input type="password" id="login-pwd" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="login-error"></div>
    <button id="login-submit" onclick="doLogin()">登录</button>
  </div>
</div>

<!-- ── Toast ── -->
<div id="toast"></div>

<header>
  <h1 id="title">CRM &amp; ERP AI 智能助手</h1>
  <button id="lang-btn" onclick="toggleLang()">中文</button>
</header>

<div id="shortcuts"></div>

<div id="chat"></div>

<div id="input-bar">
  <button id="voice-btn" onclick="toggleVoice()" title="语音输入">🎤</button>
  <textarea id="input" rows="1" placeholder="输入你的问题，例如：上个月的总销售额是多少？"></textarea>
  <button id="send-btn" onclick="sendMessage()">发送</button>
</div>

<script>
// ════════════════════════════════════════════════════════
// 常量与状态
// ════════════════════════════════════════════════════════
let history = [];
const MAX_HISTORY = 20;
const COOLDOWN_SEC = 20;
const TOKEN_KEY = 'ai_assistant_token';
const TOKEN_EXP_KEY = 'ai_assistant_exp';

let currentLang = 'zh-CN';
let lastQueryTime = 0;
let cooldownTimer = null;
let recaptchaSiteKey = '';
let recaptchaReady = false;   // v3 script 加载完成标志
let failCount = 0;

// ════════════════════════════════════════════════════════
// 快捷问题列表
// ════════════════════════════════════════════════════════
const SHORTCUTS = [
  ['上个月的总销售额是多少？', 'What was the total sales last month?'],
  ['销售额最高的前 5 个客户是谁？', 'Who are the top 5 customers by sales?'],
  ['今年每个月的销售额趋势？', 'Show me the monthly sales trend this year.'],
  ['本月和上月的销售额对比', "Compare this month's sales vs last month."],
  ['哪个仓库的销售额最高？', 'Which warehouse has the highest sales?'],
  ['今年到目前的累计销售额是多少？', 'What is the YTD total sales so far?'],
  ['最近 7 天有哪些新订单？', 'What are the new orders in the last 7 days?'],
  ['哪些订单还未完成发货？', 'Which orders have not been fully shipped yet?'],
  ['客户 XX 最近 3 个月下了多少单？', 'How many orders did customer XX place in the last 3 months?'],
  ['超过 90 天没有再次购买的客户有哪些？', "Which customers haven't ordered in the last 90 days?"],
  ['信用额度最高的前 10 个客户', 'List the top 10 customers by credit limit.'],
  ['B2B 和 B2C 客户各有多少？', 'How many B2B vs B2C customers do we have?'],
  ['哪些客户有未收款的发票？', 'Which customers have outstanding unpaid invoices?'],
  ['逾期未付款的客户列表', 'List customers with overdue invoices.'],
  ['目前谈判阶段的商机有哪些？总金额是多少？', "What deals are in negotiating stage? What's the total value?"],
  ['本月新增的商机有哪些？', 'What new deals were created this month?'],
  ['本月成交（won）的商机统计', 'Summarize the won deals this month.'],
  ['每个销售员各有多少个进行中的商机？', 'How many active deals does each salesperson have?'],
  ['金额最高的 10 个商机', 'List the top 10 deals by amount.'],
  ['哪些高优先级商机还没有跟进记录？', 'Which high-priority deals have no activity logged?'],
  ['各销售员的商机总金额对比', 'Compare total deal amounts by salesperson.'],
  ['哪些商品库存低于补货触发点？', 'Which products are below the reorder point?'],
  ['哪些商品库存低于安全库存？', 'Which products are below the safety stock level?'],
  ['各仓库的库存总量', 'Show total stock quantity by warehouse.'],
  ['商品 XX 在各仓库的可用库存是多少？', 'What is the available stock of product XX across all warehouses?'],
  ['库存可用量为零的商品列表', 'List products with zero available stock.'],
  ['库存总价值最高的前 10 个商品', 'Top 10 products by total inventory value (qty × avg cost).'],
  ['本月收到了多少款项？', 'How much payment was received this month?'],
  ['目前未收款的发票总金额是多少？', 'What is the total amount of unpaid invoices?'],
  ['30 天以上未收款的发票有哪些？', 'List invoices unpaid for more than 30 days.'],
  ['各付款方式的收款金额占比', 'Break down payment received by payment method.'],
  ['本月各销售员的目标金额是多少？', 'What are the sales targets for each rep this month?'],
  ['各销售员目标达成情况', 'How is each salesperson tracking against their target?'],
  ['销售额最高的 3 个客户，他们在 CRM 里有没有进行中的商机？', 'Which top customers have active CRM deals we should prioritize?'],
  ['哪些客户有逾期未付款发票，且在 CRM 里还有跟进中的商机？', 'Which customers have overdue invoices but still have ongoing deals in CRM?'],
];

const UI_TEXT = {
  'zh-CN': {
    title: 'CRM & ERP AI 智能助手',
    langBtn: '中文',
    placeholder: '输入你的问题，例如：上个月的总销售额是多少？',
    send: '发送',
    thinking: '思考中',
    error: '查询失败，请稍后重试。',
    loginTitle: '请登录',
    loginBtn: '登录',
    emailLabel: '邮箱',
    pwdLabel: '密码',
  },
  'en-US': {
    title: 'CRM & ERP AI Assistant',
    langBtn: 'EN',
    placeholder: 'Ask a question, e.g. What was the total sales last month?',
    send: 'Send',
    thinking: 'Thinking',
    error: 'Query failed, please try again later.',
    loginTitle: 'Please Log In',
    loginBtn: 'Log In',
    emailLabel: 'Email',
    pwdLabel: 'Password',
  },
};

// ════════════════════════════════════════════════════════
// Token / 登录状态
// ════════════════════════════════════════════════════════
function isLoggedIn() {
  const exp = localStorage.getItem(TOKEN_EXP_KEY);
  return exp && Date.now() < parseInt(exp);
}

function getToken() {
  return localStorage.getItem(TOKEN_KEY) || '';
}

function clearToken() {
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(TOKEN_EXP_KEY);
}

// ════════════════════════════════════════════════════════
// 登录弹窗
// ════════════════════════════════════════════════════════
function showLoginModal() {
  document.getElementById('login-overlay').classList.add('show');
  document.getElementById('login-email').focus();
}

function hideLoginModal() {
  document.getElementById('login-overlay').classList.remove('show');
}

// reCAPTCHA v3：动态加载脚本（仅加载一次），加载完成后设 recaptchaReady = true
function loadRecaptchaV3() {
  if (recaptchaReady || !recaptchaSiteKey) return;
  window._onRecaptchaV3Load = () => { recaptchaReady = true; };
  const s = document.createElement('script');
  s.src = 'https://www.google.com/recaptcha/api.js?render=' + recaptchaSiteKey +
          '&onload=_onRecaptchaV3Load';
  document.head.appendChild(s);
}

// 获取 v3 token（失败时返回空字符串）
function getRecaptchaToken(action) {
  return new Promise((resolve) => {
    if (!recaptchaSiteKey || !window.grecaptcha) { resolve(''); return; }
    grecaptcha.ready(() => {
      grecaptcha.execute(recaptchaSiteKey, { action })
        .then(resolve)
        .catch(() => resolve(''));
    });
  });
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pwd   = document.getElementById('login-pwd').value;
  const errEl = document.getElementById('login-error');
  const btn   = document.getElementById('login-submit');

  errEl.style.display = 'none';
  btn.disabled = true;

  const body = { email, password: pwd };

  // 失败 3 次后附上 reCAPTCHA v3 token（无感执行，无需用户操作）
  if (failCount >= 3) {
    const rcToken = await getRecaptchaToken('login');
    if (rcToken) body.recaptcha_token = rcToken;
  }

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (res.ok) {
      const data = await res.json();
      localStorage.setItem(TOKEN_KEY, data.token);
      localStorage.setItem(TOKEN_EXP_KEY, String(Date.now() + 24 * 3600 * 1000));
      hideLoginModal();
      failCount = 0;
    } else {
      failCount++;
      const detail = (await res.json().catch(() => ({}))).detail || '';
      if (detail === 'recaptcha_failed') {
        errEl.textContent = '系统检测到异常操作，请稍后再试';
      } else {
        errEl.textContent = '邮箱或密码错误，请重试';
      }
      errEl.style.display = 'block';
    }
  } catch (_) {
    errEl.textContent = '网络错误，请稍后重试';
    errEl.style.display = 'block';
  }

  btn.disabled = false;
}

// Enter 键：email → 跳到密码框，pwd → 触发登录
document.getElementById('login-email').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('login-pwd').focus();
});
document.getElementById('login-pwd').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});

// ════════════════════════════════════════════════════════
// Toast
// ════════════════════════════════════════════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2000);
}

// ════════════════════════════════════════════════════════
// 冷却倒计时
// ════════════════════════════════════════════════════════
function startCooldown() {
  const sendBtn  = document.getElementById('send-btn');
  const voiceBtn = document.getElementById('voice-btn');
  sendBtn.disabled  = true;
  voiceBtn.disabled = true;
  lastQueryTime = Date.now();
  let remain = COOLDOWN_SEC;

  cooldownTimer = setInterval(() => {
    remain--;
    sendBtn.textContent = remain + 's';
    if (remain <= 0) {
      clearInterval(cooldownTimer);
      cooldownTimer = null;
      sendBtn.disabled  = false;
      voiceBtn.disabled = false;
      sendBtn.textContent = UI_TEXT[currentLang].send;
    }
  }, 1000);
}

// ════════════════════════════════════════════════════════
// Excel 导出
// ════════════════════════════════════════════════════════
function hasTable(text) {
  return /\|\s*[-:]+[-:\s|]*\|/.test(text);
}

function parseMarkdownTable(text) {
  const lines = text.split('\n').filter(l => l.includes('|'));
  return lines
    .filter(l => !/^\s*\|[\s|:-]+\|\s*$/.test(l))  // 跳过分隔行
    .map(l => l.split('|').map(c => c.trim()).filter(c => c !== ''));
}

function exportExcel(rawText) {
  const data = parseMarkdownTable(rawText);
  if (!data.length) return;
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '查询结果');
  const filename = 'ai_query_' + new Date().toISOString().slice(0, 10) + '.xlsx';
  XLSX.writeFile(wb, filename);
}

// ════════════════════════════════════════════════════════
// 消息渲染
// ════════════════════════════════════════════════════════
function appendMessage(role, html) {
  const chatEl = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = html;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function renderAssistantMessage(rawText) {
  const chatEl = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = marked.parse(rawText);

  if (hasTable(rawText)) {
    const btn = document.createElement('button');
    btn.className = 'export-btn';
    btn.textContent = '📥 导出 Excel';
    btn.onclick = () => exportExcel(rawText);
    div.appendChild(btn);
  }

  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function showThinking() {
  const text = UI_TEXT[currentLang].thinking;
  return appendMessage('thinking', text + '<span class="dots"><span>.</span><span>.</span><span>.</span></span>');
}

// ════════════════════════════════════════════════════════
// 发送消息
// ════════════════════════════════════════════════════════
async function sendMessage() {
  // 未登录 → 弹出登录框
  if (!isLoggedIn()) {
    showLoginModal();
    return;
  }

  // 冷却期检查
  const elapsed = (Date.now() - lastQueryTime) / 1000;
  if (elapsed < COOLDOWN_SEC && lastQueryTime > 0) {
    const remain = Math.ceil(COOLDOWN_SEC - elapsed);
    showToast(`请等待 ${remain} 秒后再查询`);
    return;
  }

  const input = document.getElementById('input');
  const msg = input.value.trim();
  if (!msg) return;

  appendMessage('user', escapeHtml(msg));
  input.value = '';
  autoResize();
  startCooldown();

  const thinkingEl = showThinking();
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + getToken(),
      },
      body: JSON.stringify({ message: msg, history }),
    });

    // Token 过期或无效
    if (res.status === 401) {
      thinkingEl.remove();
      clearToken();
      showLoginModal();
      return;
    }

    // 后端限速（极罕见，前端冷却已覆盖大部分情况）
    if (res.status === 429) {
      thinkingEl.remove();
      showToast('操作过于频繁，请稍候再试');
      return;
    }

    const data = await res.json();

    history.push({ role: 'user', content: msg });
    history.push({ role: 'assistant', content: data.reply });
    if (history.length > MAX_HISTORY * 2) {
      history = history.slice(-MAX_HISTORY * 2);
    }

    thinkingEl.remove();
    renderAssistantMessage(data.reply);
  } catch (_) {
    thinkingEl.remove();
    appendMessage('assistant', UI_TEXT[currentLang].error);
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function autoResize() {
  const input = document.getElementById('input');
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
}

document.getElementById('input').addEventListener('input', autoResize);
document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ════════════════════════════════════════════════════════
// 快捷按钮
// ════════════════════════════════════════════════════════
function renderShortcuts() {
  const box = document.getElementById('shortcuts');
  box.innerHTML = '';
  SHORTCUTS.forEach(([zh, en]) => {
    const btn = document.createElement('button');
    btn.className = 'shortcut-btn';
    btn.textContent = currentLang === 'zh-CN' ? zh : en;
    btn.onclick = () => {
      const input = document.getElementById('input');
      input.value = currentLang === 'zh-CN' ? zh : en;
      input.focus();
    };
    box.appendChild(btn);
  });
}

// ════════════════════════════════════════════════════════
// 语言切换
// ════════════════════════════════════════════════════════
function toggleLang() {
  currentLang = currentLang === 'zh-CN' ? 'en-US' : 'zh-CN';
  const text = UI_TEXT[currentLang];
  document.getElementById('lang-btn').textContent  = text.langBtn;
  document.getElementById('title').textContent     = text.title;
  document.getElementById('input').placeholder     = text.placeholder;
  document.getElementById('login-box').querySelector('h2').textContent = text.loginTitle;
  document.getElementById('login-submit').textContent = text.loginBtn;
  // 冷却期间保留倒计时数字，不覆盖
  if (!cooldownTimer) {
    document.getElementById('send-btn').textContent = text.send;
  }
  if (recognition) recognition.lang = currentLang;
  renderShortcuts();
}

// ════════════════════════════════════════════════════════
// 语音输入
// ════════════════════════════════════════════════════════
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const voiceBtn = document.getElementById('voice-btn');
let recognition = null;
let isRecording = false;

if (!SpeechRecognition) {
  voiceBtn.style.display = 'none';
} else {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = currentLang;

  recognition.onresult = (event) => {
    const transcript = Array.from(event.results)
      .map(r => r[0].transcript).join('');
    document.getElementById('input').value = transcript;
    autoResize();
  };

  recognition.onend = () => {
    isRecording = false;
    voiceBtn.classList.remove('recording');
  };

  recognition.onerror = (e) => {
    isRecording = false;
    voiceBtn.classList.remove('recording');
    if (e.error === 'not-allowed') {
      alert('请在浏览器设置中允许麦克风权限');
    }
  };
}

function toggleVoice() {
  if (!recognition) return;
  if (isRecording) {
    recognition.stop();
  } else {
    recognition.lang = currentLang;
    recognition.start();
    isRecording = true;
    voiceBtn.classList.add('recording');
  }
}

// ════════════════════════════════════════════════════════
// 初始化
// ════════════════════════════════════════════════════════
(async function init() {
  // 拉取 reCAPTCHA v3 Site Key 并预加载脚本（不阻塞登录框显示）
  try {
    const r = await fetch('/config');
    const cfg = await r.json();
    recaptchaSiteKey = cfg.recaptcha_site_key || '';
    loadRecaptchaV3();  // 提前加载，首次登录失败第 3 次时已就绪
  } catch (_) { /* 离线/本地开发忽略 */ }

  if (!isLoggedIn()) {
    showLoginModal();
  }

  renderShortcuts();
})();
</script>
